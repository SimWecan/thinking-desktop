<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Thinking Desktop</title>
<!--
  双形态壁纸：
  · 待机 —— 自绘旋臂粒子海（web 内 canvas，见下方 script）
  · 思考 —— HALOFLUX by Ryder191（web/haloflux/，PolyForm Noncommercial，仅个人非商业）
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06080d; }
  #halo {
    position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
    opacity: 0; transition: opacity 1.8s ease; z-index: 1;
  }
  #idlewrap {
    position: fixed; inset: 0; z-index: 2;
    opacity: 1; transition: opacity 2.2s ease;
  }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    color: #9fb4d0; opacity: 0; transition: opacity .4s; pointer-events: none;
    text-shadow: 0 1px 4px #000;
  }
  #hud b { color: #e8f1ff; }
</style>
</head>
<body>
<iframe id="halo" src="/haloflux/"></iframe>
<div id="idlewrap">
  <canvas id="c"></canvas>
  <div id="hud"></div>
</div>
<script>
"use strict";
const DEBUG = __DEBUG__;
const BUSY_HOLD = 30000;   // 任一来源 30 秒内有事件 → 保持「思考中」状态
const TIME_IDLE = 0.10, TIME_ACTIVE = 1.0;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
const idleWrap = document.getElementById("idlewrap");
const halo = document.getElementById("halo");
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

// ---------------- 状态 ----------------
let lastEventAt = 0, energy = 0, burst = 0, errFlash = 0;
let rate = 0, byType = {}, bySource = {};
let stateTimer = 0;
const ripples = [];
let active = false, lastParamPush = 0;

function haloMsg(m) { try { halo.contentWindow?.postMessage(m, "*"); } catch {} }

/** 待机 ⇄ 思考 形态切换 */
function setActive(on) {
  if (active === on) return;
  active = on;
  halo.style.opacity = on ? 1 : 0;      // HALOFLUX 淡入/淡出
  idleWrap.style.opacity = on ? 0 : 1;  // 粒子海淡出/淡入
  haloMsg({ td: "pause", value: !on }); // 待机时暂停渲染省 CPU
}

/** 活动强度 → HALOFLUX 参数 */
function pushParams(now) {
  if (now - lastParamPush < 1000) return;
  lastParamPush = now;
  const r = Math.min(rate, 3);
  haloMsg({ td: "set", key: "tempo", value: +(0.65 + r * 0.2 + burst * 0.15).toFixed(2) });
  haloMsg({ td: "set", key: "ringSpeed", value: +(0.55 + r * 0.18 + energy * 0.2).toFixed(2) });
  haloMsg({ td: "set", key: "beamGlow", value: +(2.6 + burst * 1.6).toFixed(2) });
  haloMsg({ td: "set", key: "glow", value: +(1.1 + energy * 0.4).toFixed(2) });
}

// ---------------- SSE ----------------
const es = new EventSource("/stream");
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === "hello") {
    rate = e.state.rate; byType = e.state.byType; bySource = e.state.bySource;
    lastEventAt = e.state.lastEventAt;
    return;
  }
  lastEventAt = e.ts;
  if (e.type === "error") errFlash = 1;
  else if (e.type === "tool_call") burst = Math.min(burst + 0.45, 1.5);
  else if (e.type === "status") energy = Math.min(energy + 0.10, 1.5);
  else if (e.type === "token") energy = Math.min(energy + 0.12, 1.5);
  else energy = Math.min(energy + 0.15, 1.5);
  if (e.type !== "status") ripples.push({ r: 20, a: 0.5 });
};
es.onerror = () => { /* 断线由 EventSource 自动重连 */ };

setInterval(async () => {
  try {
    const s = await (await fetch("/state")).json();
    rate = s.rate; byType = s.byType; bySource = s.bySource;
  } catch {}
}, 2000);

// ---------------- 粒子（螺旋思考流 · 待机形态，保持不变） ----------------
const N = 360;
const ps = Array.from({ length: N }, () => spawn(true));
function spawn(anywhere) {
  const arm = Math.floor(Math.random() * 3);
  const a = (arm * Math.PI * 2 / 3) + Math.random() * 0.9;
  const r = 60 + Math.random() * Math.max(W, H) * 0.5;
  return {
    arm, ang: a, r,
    speed: 0.25 + Math.random() * 0.5,
    life: anywhere ? Math.random() : 1,
    size: 0.7 + Math.random() * 2.0,
    hue: 200 + Math.random() * 45,
  };
}

// ---------------- 主循环 ----------------
let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now;

  const idle = now - lastEventAt > BUSY_HOLD;
  const timeScale = idle ? TIME_IDLE : TIME_ACTIVE;
  const target = idle ? 0.12 : 0.75 + Math.min(rate, 3) / 3 * 0.6;
  energy += (target - energy) * 0.04;
  burst *= 0.93; errFlash *= 0.90;

  // 形态切换 + 参数驱动
  setActive(!idle);
  if (active) pushParams(now);

  ctx.fillStyle = "rgba(6,8,13,0.22)";
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const glow = 0.35 + energy * 0.85 + burst * 0.6;

  // 核心光晕（多层）
  for (const [rad, alphaMul] of [[260 + burst * 140, 1], [120, 1.6]]) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad + energy * 80);
    g.addColorStop(0, `rgba(${errFlash > 0.3 ? "255,90,90" : "130,190,255"},${0.14 * glow * alphaMul})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  // 思考粒子：沿旋臂向核心流动
  ctx.globalCompositeOperation = "lighter";
  for (const p of ps) {
    p.ang += p.speed * timeScale * dt * (0.5 + energy);
    p.r -= (14 + energy * 26 + burst * 30) * timeScale * dt;
    p.life -= dt * 0.10 * timeScale;

    if (p.life <= 0 || p.r < 26) Object.assign(p, spawn(false));

    const wob = Math.sin(p.ang * 3 + now / 900) * 8;
    const x = cx + Math.cos(p.ang) * (p.r + wob);
    const y = cy + Math.sin(p.ang) * (p.r + wob) * 0.72;

    const a = 0.75 * p.life * glow;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue + errFlash * -160}, 85%, ${58 + glow * 18}%, ${a})`;
    ctx.arc(x, y, p.size * (1 + burst * 0.9), 0, 7);
    ctx.fill();
    // 亮度拖尾
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, 85%, 65%, ${a * 0.35})`;
    ctx.arc(x - Math.cos(p.ang) * p.size * 4, y - Math.sin(p.ang) * p.size * 4, p.size * 0.7, 0, 7);
    ctx.fill();
  }

  // 事件涟漪
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += 260 * timeScale * dt; rp.a *= 0.90;
    if (rp.a < 0.02) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.strokeStyle = `rgba(150,205,255,${rp.a * glow})`;
    ctx.lineWidth = 1.5;
    ctx.arc(cx, cy, rp.r, 0, 7);
    ctx.stroke();
  }

  // 工具调用脉冲环
  if (burst > 0.5) {
    ctx.beginPath();
    ctx.strokeStyle = `rgba(170,215,255,${(burst - 0.5) * 0.7})`;
    ctx.lineWidth = 2;
    ctx.arc(cx, cy, (1.5 - burst) * 420, 0, 7);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";

  // HUD（?debug=1）
  if (DEBUG) {
    hud.style.opacity = 1;
    if (now - stateTimer > 500) {
      stateTimer = now;
      hud.innerHTML =
        `<b>Thinking Desktop</b> · ${idle ? "待命" : "思考中"} · 速率 <b>${rate}</b> 事件/s` +
        `<br>来源: ${Object.entries(bySource).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}` +
        `<br>类型: ${Object.entries(byType).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}`;
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
