<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Thinking Desktop</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06080d; cursor: crosshair; }
  #c { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 16px; bottom: 14px;
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    color: #9fb4d0; opacity: 0; transition: opacity .4s; pointer-events: none;
    text-shadow: 0 1px 4px #000;
  }
  #hud b { color: #e8f1ff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
"use strict";
const DEBUG = __DEBUG__;
const BUSY_HOLD = 30000;   // 任一来源 30 秒内有事件 → 思考态（形态不变，强度提升）

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const hud = document.getElementById("hud");
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

// ---------------- 状态 ----------------
let lastEventAt = 0, energy = 0, errFlash = 0;
let rate = 0, byType = {}, bySource = {};
let stateTimer = 0;
const ripples = [];   // 事件涟漪
const shocks = [];    // 点击冲击波
const mouse = { x: -9999, y: -9999, down: false };

// ---------------- SSE：AI 事件驱动 ----------------
const es = new EventSource("/stream");
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === "hello") {
    rate = e.state.rate; byType = e.state.byType; bySource = e.state.bySource;
    lastEventAt = e.state.lastEventAt;
    return;
  }
  lastEventAt = e.ts;
  if (e.type === "error") errFlash = 1;
  else if (e.type === "tool_call") { energy = Math.min(energy + 0.3, 1.6); ripples.push({ r: 24, a: 0.7, w: 3 }); }
  else if (e.type === "token") energy = Math.min(energy + 0.12, 1.6);
  else if (e.type === "status") energy = Math.min(energy + 0.10, 1.6);
  else energy = Math.min(energy + 0.15, 1.6);
  if (e.type !== "status") ripples.push({ r: 18, a: 0.4, w: 1.5 });
};
es.onerror = () => { /* 断线由 EventSource 自动重连 */ };

setInterval(async () => {
  try {
    const s = await (await fetch("/state")).json();
    rate = s.rate; byType = s.byType; bySource = s.bySource;
  } catch {}
}, 2000);

// ---------------- 交互（浏览器预览中生效；桌面壁纸点击穿透） ----------------
addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener("mouseleave", () => { mouse.x = mouse.y = -9999; });
addEventListener("mousedown", () => {
  mouse.down = true;
  shocks.push({ x: mouse.x, y: mouse.y, r: 8, a: 0.9 });
});
addEventListener("mouseup", () => { mouse.down = false; });
addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  shocks.push({ x: mouse.x, y: mouse.y, r: 8, a: 0.9 });
}, { passive: true });
addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: true });

// ---------------- 粒子：向中心汇聚的螺旋流 ----------------
const N = 340;
const ps = Array.from({ length: N }, () => spawn(true));
function spawn(anywhere) {
  // 从屏幕边缘出生，向中心汇聚
  const side = Math.floor(Math.random() * 4);
  const m = 30;
  let x, y;
  if (side === 0) { x = Math.random() * W; y = -m; }
  else if (side === 1) { x = W + m; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = H + m; }
  else { x = -m; y = Math.random() * H; }
  if (anywhere) { // 首屏铺满：沿出生点到中心的轨迹随机落位
    const t = Math.random();
    x = x + (W / 2 - x) * t;
    y = y + (H / 2 - y) * t;
  }
  return { x, y, vx: 0, vy: 0, size: 0.7 + Math.random() * 1.9, hue: 200 + Math.random() * 45 };
}

// ---------------- 主循环 ----------------
let prev = performance.now();
function frame(now) {
  const dt = Math.min((now - prev) / 1000, 0.05); prev = now;

  const idle = now - lastEventAt > BUSY_HOLD;
  const thinking = !idle;
  const breath = 0.85 + 0.15 * Math.sin(now / 2600);          // 呼吸
  const target = idle ? 0.16 : 0.85 + Math.min(rate, 3) / 3 * 0.6;
  energy += (target - energy) * 0.04;
  errFlash *= 0.90;

  const cx = W / 2, cy = H / 2;
  const glow = (0.4 + energy * 1.0) * breath;
  const pull = (idle ? 22 : 40 + energy * 55) * breath;        // 向心拉力
  const swirl = 30 + energy * 45;                              // 切向旋转 → 螺旋汇聚

  ctx.fillStyle = "rgba(6,8,13,0.22)";
  ctx.fillRect(0, 0, W, H);

  // 核心光晕（多层呼吸）
  for (const [rad, mul] of [[300 + energy * 160, 1], [130, 1.7]]) {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    const err = errFlash > 0.3;
    g.addColorStop(0, `rgba(${err ? "255,90,90" : "130,190,255"},${0.15 * glow * mul})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = "lighter";
  for (const p of ps) {
    let dx = cx - p.x, dy = cy - p.y;
    let d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    // 汇聚力 + 螺旋切向力
    p.vx += (nx * pull + -ny * swirl) * dt;
    p.vy += (ny * pull + nx * swirl * 0.72) * dt;

    // 鼠标排斥（靠近光标的粒子被推开）
    const mdx = p.x - mouse.x, mdy = p.y - mouse.y;
    const md = Math.hypot(mdx, mdy);
    if (md < 160 && md > 1) {
      const f = (1 - md / 160) * (mouse.down ? 320 : 130);
      p.vx += (mdx / md) * f * dt;
      p.vy += (mdy / md) * f * dt;
    }

    // 点击冲击波推离
    for (const s of shocks) {
      const sdx = p.x - s.x, sdy = p.y - s.y;
      const sd = Math.hypot(sdx, sdy);
      if (sd < s.r && sd > 1) {
        const f = (1 - sd / s.r) * 900 * s.a;
        p.vx += (sdx / sd) * f * dt;
        p.vy += (sdy / sd) * f * dt;
      }
    }

    p.vx *= 0.96; p.vy *= 0.96;
    p.x += p.vx * dt * 2.4;
    p.y += p.vy * dt * 2.4;

    // 抵达核心 → 吸收重生
    if (d < 34) { Object.assign(p, spawn(false)); continue; }

    const speed = Math.hypot(p.vx, p.vy);
    const a = Math.min(0.9, 0.35 + glow * 0.45 + speed * 0.012);
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue + errFlash * -160}, 85%, ${56 + glow * 16}%, ${a})`;
    ctx.arc(p.x, p.y, p.size * (1 + energy * 0.35), 0, 7);
    ctx.fill();
    // 速度拖尾
    const tl = Math.min(10, 2 + speed * 0.25);
    ctx.beginPath();
    ctx.strokeStyle = `hsla(${p.hue}, 85%, 62%, ${a * 0.4})`;
    ctx.lineWidth = p.size * 0.75;
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * tl * 0.12, p.y - p.vy * tl * 0.12);
    ctx.stroke();
  }

  // 事件涟漪（从核心扩散）
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += (220 + energy * 160) * dt; rp.a *= 0.91;
    if (rp.a < 0.02) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.strokeStyle = `rgba(150,205,255,${rp.a * glow})`;
    ctx.lineWidth = rp.w;
    ctx.arc(cx, cy, rp.r, 0, 7);
    ctx.stroke();
  }

  // 点击冲击波环
  for (let i = shocks.length - 1; i >= 0; i--) {
    const s = shocks[i];
    s.r += 620 * dt; s.a *= 0.90;
    if (s.a < 0.03) { shocks.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.strokeStyle = `rgba(190,225,255,${s.a})`;
    ctx.lineWidth = 2.5;
    ctx.arc(s.x, s.y, s.r, 0, 7);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";

  // HUD（?debug=1）
  if (DEBUG) {
    hud.style.opacity = 1;
    if (now - stateTimer > 500) {
      stateTimer = now;
      hud.innerHTML =
        `<b>Thinking Desktop</b> · ${idle ? "待机 · 汇聚" : "思考中"} · 速率 <b>${rate}</b> 事件/s` +
        `<br>来源: ${Object.entries(bySource).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}` +
        `<br>类型: ${Object.entries(byType).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}` +
        `<br><span style="opacity:.7">移动鼠标推开粒子 · 点击产生冲击波</span>`;
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
