<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Thinking Desktop</title>
<!--
  单一运行界面（HALOFLUX 光环，web/haloflux/）：
  · 待机 —— tdSetStandby(true)：环带原地停止，环内/环外粒子特效消失，环上保留截流文本
  · 活动 —— tdSetStandby(false)：环带转动、粒子特效重现，强度随事件速率
  · 环上文本 —— 开源 AI 截流真实思考文本；闭源 AI 预设动画
  · 鼠标 —— 悬停环带局部放大查看文字（桌面端由原生宿主转发全局鼠标）
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08090b; }
  #halo { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; z-index: 1; }
  #hud {
    position: fixed; left: 16px; bottom: 14px; z-index: 2;
    font: 11px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    color: #9fb4d0; opacity: 0; transition: opacity .4s; pointer-events: none;
    text-shadow: 0 1px 4px #000;
  }
  #hud b { color: #e8f1ff; }
</style>
</head>
<body>
<iframe id="halo" src="/haloflux/"></iframe>
<div id="hud"></div>
<script>
"use strict";
const DEBUG = __DEBUG__;
const BUSY_HOLD = 30000;   // 任一来源 30 秒内有真实工作信号 → 活动态

const hud = document.getElementById("hud");
const halo = document.getElementById("halo");

// ---------------- 状态 ----------------
let energy = 0, rate = 0, byType = {}, bySource = {};
let workAt = 0;          // 最后一次真实工作信号（token/文本/工具/编辑）
let busyUntil = 0;       // status running>0 的短暂宽限
let standby = null;      // 当前待机位（null=未初始化）
let lastParamPush = 0, stateTimer = 0;

function haloMsg(m) { try { halo.contentWindow?.postMessage(m, "*"); } catch {} }

// 桌面壁纸点击穿透收不到鼠标：由原生宿主转发全局鼠标位置（预览页直接用原生 mousemove）
window.__tdMouse = (x, y) => haloMsg({ td: "mouse", x, y });
addEventListener("mousemove", (e) => window.__tdMouse(e.clientX, e.clientY));

/** 待机 ⇄ 活动：同一张光环界面，环带停/转、粒子隐/现 */
function setStandby(on) {
  if (standby === on) return;
  standby = on;
  haloMsg({ td: "standby", value: on });
  setTimeout(() => { if (standby === on) haloMsg({ td: "standby", value: on }); }, 800);
}

/** 活动强度 → HALOFLUX 参数 */
function pushParams() {
  const now = Date.now();
  if (now - lastParamPush < 1000) return;
  lastParamPush = now;
  const r = Math.min(rate, 3);
  haloMsg({ td: "set", key: "tempo", value: +(0.65 + r * 0.2 + energy * 0.15).toFixed(2) });
  haloMsg({ td: "set", key: "ringSpeed", value: +(0.55 + r * 0.18 + energy * 0.2).toFixed(2) });
  haloMsg({ td: "set", key: "beamGlow", value: +(2.6 + energy * 0.9).toFixed(2) });
  haloMsg({ td: "set", key: "glow", value: +(1.1 + energy * 0.4).toFixed(2) });
}

// iframe 加载完成后同步当前状态（启动早期的消息 iframe 还没监听，会丢失）
halo.addEventListener("load", () => {
  standby = null;
  setStandby(currentStandby());
  pushParams();
});
window.addEventListener("message", (ev) => {
  if (ev.data && ev.data.td === "ready") {
    standby = null;
    setStandby(currentStandby());
    pushParams();
  }
});

function currentStandby() {
  const now = Date.now();
  return now - workAt > BUSY_HOLD && now > busyUntil;
}

// ---------------- SSE：AI 事件驱动 ----------------
const es = new EventSource("/stream");
es.onmessage = (ev) => {
  const e = JSON.parse(ev.data);
  if (e.type === "hello") {
    rate = e.state.rate; byType = e.state.byType; bySource = e.state.bySource;
    workAt = e.state.lastEventAt;
    return;
  }
  if (e.type === "status") {
    if (e.payload && e.payload.running > 0) busyUntil = e.ts + 15000;
    return;
  }
  workAt = e.ts;
  if (e.type === "text") { haloMsg({ td: "text", text: e.payload.text }); energy = Math.min(energy + 0.12, 1.6); return; }
  if (e.type === "tool_call") energy = Math.min(energy + 0.3, 1.6);
  else energy = Math.min(energy + 0.14, 1.6);
};
es.onerror = () => { /* 断线由 EventSource 自动重连 */ };

setInterval(async () => {
  const idle = currentStandby();
  setStandby(idle);
  if (!idle) pushParams();
  energy *= 0.995;
  try {
    const s = await (await fetch("/state")).json();
    rate = s.rate; byType = s.byType; bySource = s.bySource;
    fetch("/debug", {
      method: "POST",
      body: JSON.stringify({
        idle, standby, workAt, busyUntil, energy: +energy.toFixed(3),
        haloOpacity: getComputedStyle(halo).opacity,
      }),
    }).catch(() => {});
  } catch {}
  // HUD（?debug=1）
  if (DEBUG) {
    hud.style.opacity = 1;
    if (Date.now() - stateTimer > 500) {
      stateTimer = Date.now();
      hud.innerHTML =
        `<b>Thinking Desktop</b> · ${idle ? "待机 · 圆环停止" : "思考中"} · 速率 <b>${rate}</b> 事件/s` +
        `<br>来源: ${Object.entries(bySource).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}` +
        `<br>类型: ${Object.entries(byType).map(([k, v]) => `${k}×${v}`).join(" ") || "—"}` +
        `<br><span style="opacity:.7">悬停圆带 → 局部放大查看截流文本</span>`;
    }
  }
}, 1000);
</script>
</body>
</html>
