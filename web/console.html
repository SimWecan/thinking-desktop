<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Desktop — 控制台</title>
<link rel="icon" type="image/png" href="/icon/thinking-desktop-64.png?v=0.5.1">
<link rel="icon" type="image/svg+xml" href="/icon/thinking-desktop.svg?v=0.5.1">
<link rel="stylesheet" href="/ui/terafin.css">
<style>
  :root {
    /* 控制台窗口更紧凑的节标题 */
    --sec-fs: 10px;
    --sec-margin: 20px 0 10px;
    --sec-gap: 12px;
  }
  body {
    height: 100vh; display: flex; flex-direction: column;
    font-size: 12px; line-height: 1.6;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
  }
  header .logo { width: 30px; height: 30px; border-radius: 7px; flex: none; }
  header .tt { font-size: 13px; letter-spacing: 5px; font-weight: 600; }
  header .tt .thin { color: var(--dim); font-weight: 400; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); } }

  /* ---------- 左列：状态 + 操作 ---------- */
  .left { border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 22px 22px; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { border: 1px solid var(--line); background: var(--panel); padding: 10px 12px; }
  .tile b { display: block; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--faint); font-size: 10px; letter-spacing: 2px; }

  table.ch { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.ch td, table.ch th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.ch th { color: var(--faint); font-weight: 400; font-size: 10px; letter-spacing: 2px; }
  table.ch td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  table.ch td .ago { color: var(--dim); }
  table.ch td .ago.hot { color: var(--paper); }

  .ops { display: flex; gap: 10px; flex-wrap: wrap; }
  /* .btn / .btn.ghost 见 /ui/terafin.css */
  .note { color: var(--faint); font-size: 10px; letter-spacing: 1px; margin-top: 10px; }

  /* ---------- 右列：实时日志 ---------- */
  .right { display: flex; flex-direction: column; min-height: 0; }
  .logbar {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 10px 22px; border-bottom: 1px solid var(--line);
    color: var(--faint); font-size: 10px; letter-spacing: 2px;
  }
  .logbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .logbar input { accent-color: #fff; }
  .logbar .sp { flex: 1; }
  .logbar .sz { font-variant-numeric: tabular-nums; }
  #log {
    flex: 1; margin: 0; padding: 14px 22px; overflow-y: auto;
    font: 11px/1.75 ui-monospace, "SF Mono", Menlo, monospace;
    color: rgba(255,255,255,.72); white-space: pre-wrap; word-break: break-all;
  }
  #log .t { color: var(--faint); }
  #log .warn { color: #fff; background: rgba(255,255,255,.08); }

  /* ---------- 服务离线 ---------- */
  .down {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(0,0,0,.88); z-index: 9; text-align: center;
  }
  .down.show { display: grid; }
  .down .box { border: 1px solid var(--line-2); padding: 36px 48px; background: var(--panel); }
  .down b { display: block; font-size: 14px; letter-spacing: 4px; margin-bottom: 10px; font-weight: 600; }
  .down span { color: var(--dim); font-size: 11px; }
</style>
</head>
<body>

<header>
  <img class="logo" src="/icon/thinking-desktop.svg?v=0.5.1" alt="">
  <div class="tt">THINKING DESKTOP <span class="thin">· 控制台</span></div>
  <span class="ver" id="ver">—</span>
  <div class="svc" id="svc"><span class="dot"></span><span id="svcTxt">连接中…</span></div>
</header>

<main>
  <div class="left">
    <h2 class="sec">运行状态</h2>
    <div class="tiles">
      <div class="tile"><b id="uptime">—</b><span>运行时长</span></div>
      <div class="tile"><b id="cpu">—</b><span>CPU %</span></div>
      <div class="tile"><b id="rss">—</b><span>内存 MB</span></div>
      <div class="tile"><b id="conns">—</b><span>数据通道</span></div>
    </div>

    <h2 class="sec">AI 桌面端通道</h2>
    <table class="ch">
      <thead><tr><th>来源</th><th>通道</th><th style="text-align:right">事件</th><th>最近活动</th></tr></thead>
      <tbody id="chBody"><tr><td colspan="4" style="color:var(--faint)">加载中…</td></tr></tbody>
    </table>

    <h2 class="sec">快捷操作</h2>
    <div class="ops">
      <button class="btn" id="restartServer">重启服务</button>
      <button class="btn" id="restartWallpaper">重启壁纸</button>
      <button class="btn ghost" id="restartBoth">全部重启</button>
      <button class="btn ghost" id="openConfig">打开完整配置</button>
    </div>
    <div class="note" id="restartMsg">重启服务让服务端改动生效；重启壁纸会清空渲染内存</div>

    <h2 class="sec">系统集成</h2>
    <div class="ops">
      <span class="note" id="axState" style="margin:0">AX 读屏：检测中…</span>
      <button class="btn ghost" id="axGrant">去授权</button>
      <button class="btn ghost" id="axCheck">重新检测</button>
    </div>
    <div class="note">授权后 Gemini / ChatGPT 等不落盘日志的桌面端也能读到真实文本；未授权时只显示工作强度。</div>
  </div>

  <div class="right">
    <div class="logbar">
      <span>实时日志</span>
      <label><input type="checkbox" id="follow" checked>自动滚动</label>
      <span class="sp"></span>
      <span class="sz" id="logSz"></span>
    </div>
    <pre id="log"></pre>
  </div>
</main>

<div class="down" id="down">
  <div class="box">
    <b>服务未运行</b>
    <span>等待 Thinking Desktop 服务恢复后自动重连…</span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let upSince = null, restarting = false;

function fmtUptime(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`;
}
function fmtAgo(ms) {
  if (!Number.isFinite(ms)) return "—";
  if (ms < 1000) return "刚刚";
  if (ms < 60_000) return `${Math.round(ms / 1000)}s 前`;
  if (ms < 3_600_000) return `${Math.round(ms / 60_000)}m 前`;
  return `${Math.round(ms / 3_600_000)}h 前`;
}

async function pollAx() {
  try {
    const r = await fetch("/ax", { cache: "no-store" });
    const d = await r.json();
    const el = $("axState");
    if (d.available === false) el.textContent = "AX 读屏：未编译 bin/axread（运行 macos/build-axread.sh）";
    else if (d.error) el.textContent = "AX 读屏：检测失败（" + d.error + "）";
    else if (d.trusted) el.textContent = "AX 读屏：已授权 · 可读取闭源端文本";
    else el.textContent = "AX 读屏：未授权 · 闭源端只有工作强度";
  } catch { $("axState").textContent = "AX 读屏：服务不可达"; }
}

$("axCheck").onclick = pollAx;
$("axGrant").onclick = () => { location.href = "x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility"; };
pollAx();
setInterval(pollAx, 15000);

async function poll() {
  try {
    const [h, v] = await Promise.all([
      fetch("/health", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)),
      fetch("/version", { cache: "no-store" }).then((r) => (r.ok ? r.text() : "")),
    ]);
    if (!h) throw new Error("health failed");
    $("down").classList.remove("show");
    $("svc").classList.remove("down");
    $("svcTxt").textContent = "服务正常";
    if (!upSince || Math.abs(h.uptimeMs - (Date.now() - upSince)) > 3000) upSince = Date.now() - h.uptimeMs;
    $("uptime").textContent = fmtUptime(Date.now() - upSince);
    $("cpu").textContent = h.cpuPct.toFixed(1);
    $("rss").textContent = h.rssMb;
    $("ver").textContent = "v" + String(v || "").trim();
    $("conns").textContent = h.connectors.length;
    $("chBody").innerHTML = h.connectors.map((c) => `
      <tr>
        <td>${c.source}</td>
        <td style="color:var(--dim)">${(c.kinds || []).join(" · ")}</td>
        <td class="num">${c.events}</td>
        <td><span class="ago ${c.agoMs != null && c.agoMs < 12000 ? "hot" : ""}">${c.lastType ? c.lastType + " · " : ""}${fmtAgo(c.agoMs)}</span></td>
      </tr>`).join("") || `<tr><td colspan="4" style="color:var(--faint)">暂无通道</td></tr>`;
    if (restarting && h.uptimeMs > 0 && h.uptimeMs < 15000) {
      restarting = false;
      $("restartMsg").textContent = "服务已重启完成";
    }
  } catch {
    $("down").classList.add("show");
    $("svc").classList.add("down");
    $("svcTxt").textContent = "服务离线";
  }
}

let lastLogKey = "";
async function pollLogs() {
  try {
    const r = await fetch("/logs?lines=200", { cache: "no-store" });
    if (!r.ok) return;
    const d = await r.json();
    const key = d.lines.length + ":" + (d.lines[d.lines.length - 1] || "");
    if (key !== lastLogKey) {
      lastLogKey = key;
      $("log").textContent = d.lines.join("\n") || "（暂无日志）";
      $("logSz").textContent = d.sizeKb + " KB";
      if ($("follow").checked) $("log").scrollTop = $("log").scrollHeight;
    }
  } catch { /* 服务离线时状态块会兜底 */ }
}

async function restart(target, btn) {
  const msg = $("restartMsg");
  btn.disabled = true;
  msg.textContent = target === "wallpaper" ? "正在重启壁纸…" : target === "server" ? "正在重启服务…" : "正在全部重启…";
  try {
    const res = await fetch("/restart", { method: "POST", body: JSON.stringify({ target }) });
    if (!res.ok) throw new Error(String(res.status));
    restarting = true;
    msg.textContent = "重启指令已发出，等待服务恢复…";
  } catch (e) {
    msg.textContent = "重启失败：" + e.message;
  } finally {
    btn.disabled = false;
  }
}

$("restartServer").onclick = (e) => restart("server", e.target);
$("restartWallpaper").onclick = (e) => restart("wallpaper", e.target);
$("restartBoth").onclick = (e) => restart("both", e.target);
$("openConfig").onclick = () => { location.href = "/config"; };

poll(); pollLogs();
setInterval(poll, 2000);
setInterval(pollLogs, 2000);
</script>
</body>
</html>
