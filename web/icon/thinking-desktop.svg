<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Thinking Desktop · TerraFin Black & White 软件商标 -->
  <!-- 母题：光环（halo）——细环 + 主弧 + 轨道卫星点，纯黑底纯白形，无彩色 -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <!-- 外圈发丝环：存在感压到最低，衬出主弧 -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="5"/>
  <!-- 主弧：环带正在转动的那一段（约 200°），圆头收尾 -->
  <path d="M 256 98 A 158 158 0 1 1 202 404.5"
        fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round"/>
  <!-- 弧尾甩出的思考粒子：由近及远渐隐 -->
  <circle cx="144.3" cy="367.7" r="7" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="113" cy="325" r="4" fill="#FFFFFF" fill-opacity="0.18"/>
  <!-- 轨道卫星点：略出轨道的运行体，打破绝对对称 -->
  <circle cx="425.1" cy="317.6" r="10" fill="#FFFFFF"/>
  <!-- 环心：一点，「思考的主体」 -->
  <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
</svg>
