<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Thinking Desktop · Tray</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font: 10px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-user-select: none; user-select: none; }
  #tray { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 10px; }

  /* 透明悬浮：无底框无底色，只有图形与颜色 */
  .icon {
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.52);
    transition: transform .22s cubic-bezier(.2,.8,.2,1), color .3s ease, background .3s ease,
                box-shadow .3s ease, opacity .3s ease;
    -webkit-backdrop-filter: blur(2px);
  }
  .icon svg { width: 26px; height: 26px; display: block; overflow: visible; }
  .icon:hover { transform: translateY(-1px) scale(1.08); color: rgba(255,255,255,.92); }
  .icon.sel { color: var(--c, #fff); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c, #fff) 70%, transparent), 0 0 18px -2px var(--c, #fff); }
  .icon.think { color: var(--c, #fff); }
  .icon.think::after {
    content: ""; position: absolute; inset: 2px; border-radius: 12px; pointer-events: none;
    background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--c, #fff) 22%, transparent), transparent 70%);
    animation: halo 2.8s ease-in-out infinite;
  }
  @keyframes halo { 0%, 100% { opacity: .28; } 50% { opacity: .7; } }
  .icon.hidden { display: none; }

  .lbl { position: absolute; right: 46px; top: 50%; transform: translateY(-50%) translateX(4px);
    background: rgba(10,12,16,.9); border: 1px solid rgba(255,255,255,.16);
    padding: 3px 8px; border-radius: 5px; color: #cfd2d8; white-space: nowrap; opacity: 0;
    pointer-events: none; transition: opacity .16s ease, transform .16s ease; }
  .icon:hover .lbl { opacity: 1; transform: translateY(-50%) translateX(0); }

  /* 描边统一用 currentColor，粗细/圆角一致 */
  .icon svg .st { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icon svg .fl { fill: currentColor; }

  /* —— 综合形态：三圈 + 核心，思考时加速 —— */
  #composite .r1, #composite .r2, #composite .r3 { transform-origin: 12px 12px; }
  #composite .r1 { animation: spin 14s linear infinite; }
  #composite .r2 { animation: spin 9s linear infinite reverse; }
  #composite .r3 { animation: spin 5.5s linear infinite; opacity: .5; }
  #composite.think .r1 { animation-duration: 5s; }
  #composite.think .r2 { animation-duration: 3.4s; }
  #composite.think .r3 { animation-duration: 2.1s; opacity: .85; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* —— DeepSeek：鲸鱼轻摆 + 喷气 —— */
  .whale.think svg { animation: whaleBob 3.2s ease-in-out infinite; }
  @keyframes whaleBob { 0%, 100% { transform: translateY(1px) rotate(-3deg); } 50% { transform: translateY(-2px) rotate(3deg); } }
  .whale .spout { opacity: 0; transform-origin: 8px 6px; }
  .whale.think .spout { animation: spout 3.2s ease-in-out infinite; }
  @keyframes spout { 0%, 55% { opacity: 0; transform: translateY(2px) scale(.6); }
                     70% { opacity: .9; transform: translateY(0) scale(1); }
                     100% { opacity: 0; transform: translateY(-3px) scale(.8); } }

  /* —— Kimi：月牙 + 环绕小星 —— */
  .moon .star { transform-origin: 12px 12px; }
  .moon.think .star { animation: orbitStar 4.4s linear infinite; }
  @keyframes orbitStar { to { transform: rotate(360deg); } }
  .moon.think svg { animation: moonGlow 3.2s ease-in-out infinite; }
  @keyframes moonGlow { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

  /* —— Gemini：四角星呼吸 —— */
  .spark4.think svg { animation: sparkle 2.6s ease-in-out infinite; transform-origin: 12px 12px; }
  @keyframes sparkle { 0%, 100% { transform: scale(.9) rotate(0deg); opacity: .85; }
                       50% { transform: scale(1.06) rotate(8deg); opacity: 1; } }

  /* —— ChatGPT：六边结 —— */
  .knot .ringArc { transform-origin: 12px 12px; }
  .knot.think .ringArc { animation: knotSpin 6s linear infinite; }
  @keyframes knotSpin { to { transform: rotate(360deg); } }
  .knot.think svg { animation: knotBreath 3.4s ease-in-out infinite; }
  @keyframes knotBreath { 0%, 100% { opacity: .8; } 50% { opacity: 1; } }

  /* —— Claude：八角星缓慢旋转 + 收放 —— */
  .asterisk.think svg { animation: aster 5s ease-in-out infinite; transform-origin: 12px 12px; }
  @keyframes aster { 0%, 100% { transform: rotate(0deg) scale(.94); }
                     50% { transform: rotate(22deg) scale(1.04); } }

  /* —— Codex：终端光标闪烁 —— */
  .term .cursor { opacity: .25; }
  .term.think .cursor { animation: blink 1.05s steps(1, end) infinite; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .15; } }
  .term.think svg { animation: termNudge 2.6s ease-in-out infinite; }
  @keyframes termNudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1px); } }
</style>
</head>
<body>
<div id="tray">
  <div class="icon" id="composite" title="综合形态">
    <svg viewBox="0 0 24 24">
      <circle class="st r1" cx="12" cy="12" r="9" stroke-dasharray="2 3" opacity=".75"/>
      <circle class="st r2" cx="12" cy="12" r="6.2" stroke-dasharray="1 4" opacity=".6"/>
      <circle class="st r3" cx="12" cy="12" r="3.4" stroke-dasharray="1 2.4"/>
      <circle class="fl" cx="12" cy="12" r="1.5"/>
    </svg>
    <div class="lbl">综合形态 · 全部 agent</div>
  </div>
</div>
<script>
"use strict";
const tray = document.getElementById("tray");
const composite = document.getElementById("composite");
const icons = new Map();
let expanded = false, view = "all", agents = [];

// 每个厂商一个 24×24 的线性图标（统一描边、圆角），思考时只加「小而克制」的动作
const GLYPH = {
  whale: `<svg viewBox="0 0 24 24">
    <path class="st" d="M3.4 13.6c0-4 3.9-6.8 8.7-6.8 3.1 0 5.6 1.2 6.9 3l2.6-2.2c.3 2-.4 3.6-1.6 4.7l1.7 2.1c-1.9.5-3.5.2-4.8-.5-1.5 1.6-3.7 2.4-5.8 2.4-4.6 0-7.7-1.9-7.7-4.5z"/>
    <circle class="fl" cx="8.3" cy="10.6" r=".95"/>
    <path class="st spout" d="M7.6 6.1c.6-.5.7-1.2.3-1.9M9.4 5.4c.5-.4.6-1 .3-1.6"/>
  </svg>`,
  moon: `<svg viewBox="0 0 24 24">
    <path class="st" d="M15.6 4.6a8 8 0 1 0 3.8 14.9 8.6 8.6 0 0 1-3.8-14.9z"/>
    <circle class="fl star" cx="12" cy="3.6" r="1.15"/>
  </svg>`,
  spark4: `<svg viewBox="0 0 24 24">
    <path class="fl" d="M12 3.2c.5 3.5 2.3 5.3 5.8 5.8-3.5.5-5.3 2.3-5.8 5.8-.5-3.5-2.3-5.3-5.8-5.8 3.5-.5 5.3-2.3 5.8-5.8z" opacity=".95"/>
    <path class="fl" d="M12 14.4c.3 1.9 1.2 2.8 3.1 3.1-1.9.3-2.8 1.2-3.1 3.1-.3-1.9-1.2-2.8-3.1-3.1 1.9-.3 2.8-1.2 3.1-3.1z" opacity=".65"/>
  </svg>`,
  knot: `<svg viewBox="0 0 24 24">
    <path class="st" d="M12 3.6l7.3 4.2v8.4L12 20.4 4.7 16.2V7.8z"/>
    <path class="st ringArc" d="M8.2 9.1c1.4-2.4 5.4-2.4 6.8 0M15.8 14.9c-1.4 2.4-5.4 2.4-6.8 0" stroke-dasharray="1 2.2"/>
  </svg>`,
  asterisk: `<svg viewBox="0 0 24 24">
    <path class="st" d="M12 4.2v15.6M4.2 12h15.6M6.5 6.5l11 11M17.5 6.5l-11 11"/>
  </svg>`,
  term: `<svg viewBox="0 0 24 24">
    <rect class="st" x="3.2" y="4.6" width="17.6" height="14.8" rx="2.6"/>
    <path class="st" d="M7.2 9.6l3 2.4-3 2.4"/>
    <path class="st cursor" d="M12.6 14.6h4.1"/>
  </svg>`,
};

const CLS = { whale: "whale", moon: "moon", spark4: "spark4", knot: "knot", asterisk: "asterisk", term: "term" };

function build() {
  for (const a of agents) {
    if (!a.enabled) { icons.get(a.source)?.remove(); icons.delete(a.source); continue; }
    let el = icons.get(a.source);
    if (!el) {
      el = document.createElement("div");
      const anim = GLYPH[a.anim] ? a.anim : "spark4";
      el.className = "icon " + (CLS[anim] || anim);
      el.innerHTML = GLYPH[anim] + `<div class="lbl"></div>`;
      el.onclick = () => select(a.source);
      el.dataset.anim = a.anim;
      el.dataset.glyph = anim;
      tray.appendChild(el);
      icons.set(a.source, el);
    }
    el.style.setProperty("--c", a.color);
    el.classList.toggle("think", !!a.thinking);
    el.classList.toggle("hidden", !expanded);
    el.classList.toggle("sel", view === a.source);
    const lbl = el.querySelector(".lbl");
    lbl.textContent = (a.name || a.source) + (a.thinking ? " · 思考中" : "");
  }
  composite.classList.toggle("think", agents.some((a) => a.enabled && a.thinking));
  composite.classList.toggle("sel", view === "all");
}

async function select(agent) {
  view = agent;
  await fetch("/view", { method: "POST", body: JSON.stringify({ agent }) });
  build();
}

composite.onclick = async () => {
  if (!expanded) { expanded = true; build(); return; }
  await select("all");
};
composite.oncontextmenu = (e) => { e.preventDefault(); expanded = !expanded; build(); };

/** 自检：把托盘渲染成 PNG（没有录屏权限时也能看到图标实际长什么样） */
async function shot() {
  try {
    const el = document.getElementById("tray");
    // 量一次「全部展开」后的尺寸（同步 reflow，同一帧内还原，不会闪）
    const hidden = Array.from(el.querySelectorAll(".icon.hidden"));
    hidden.forEach((n) => n.classList.remove("hidden"));
    const rect = el.getBoundingClientRect();
    hidden.forEach((n) => n.classList.add("hidden"));
    if (!rect.width || !rect.height) return null;
    // 先把实际渲染出来的颜色读出来（foreignObject 里 CSS 变量不可靠）
    const liveIcons = Array.from(el.querySelectorAll(".icon"));
    const liveColors = liveIcons.map((n) => getComputedStyle(n).color);
    const clone = el.cloneNode(true);
    clone.querySelectorAll(".icon").forEach((n, i) => { if (liveColors[i]) n.style.color = liveColors[i]; });
    // 自检时把所有图标都展开，方便一次看全
    clone.querySelectorAll(".icon.hidden").forEach((n) => n.classList.remove("hidden"));
    const css = Array.from(document.querySelectorAll("style")).map((n) => n.textContent).join("\n");
    const html = new XMLSerializer().serializeToString(clone);
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}">` +
      `<foreignObject x="0" y="0" width="${rect.width}" height="${rect.height}">` +
      `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${rect.width}px;box-sizing:border-box"><style>${css}</style>${html}</div>` +
      `</foreignObject></svg>`;
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
    const cv = document.createElement("canvas");
    cv.width = Math.round(rect.width * 2);
    cv.height = Math.round(rect.height * 2);
    const x = cv.getContext("2d");
    x.fillStyle = "#0a0c11";
    x.fillRect(0, 0, cv.width, cv.height);
    x.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/png");
  } catch (e) { return null; }
}

let lastShotOk = null;
addEventListener("error", (e) => {
  fetch("/debug", { method: "POST", body: JSON.stringify({ client: "tray", pageError: String(e.message || e.error), src: (e.filename || "") + ":" + e.lineno }) }).catch(() => {});
});

async function poll() {
  try {
    const s = await (await fetch("/agents")).json();
    if (s.shot) {
      const png = await shot();
      lastShotOk = !!png;
      if (png) fetch("/snapshot", { method: "POST", body: JSON.stringify({ tray: png }) }).catch(() => {});
    }
    fetch("/debug", { method: "POST", body: JSON.stringify({ client: "tray", agents: agents.length, expanded, shot: !!s.shot, lastShotOk }) }).catch(() => {});
    agents = s.agents;
    if (view !== s.view) view = s.view;
    build();
  } catch (e) { lastShotOk = "poll-error"; }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
