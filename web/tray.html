<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Thinking Desktop · Tray</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden;
    font: 10px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-user-select: none; user-select: none; }
  #tray { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 10px; }

  /* 透明悬浮：商标图原样展示，所有动效都画在它「周围」，不改动图画本身 */
  .icon {
    width: 40px; height: 40px; border-radius: 11px; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center;
    opacity: .5; transition: opacity .3s ease;
  }
  .icon img.logo {
    width: 30px; height: 30px; display: block; border-radius: 7px; position: relative; z-index: 1;
    transition: filter .4s ease;
    -webkit-user-drag: none;
  }
  .icon .mono {
    width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font: 600 11px/1 ui-monospace, monospace; letter-spacing: .5px; position: relative; z-index: 1;
    color: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.18);
  }
  .icon:hover { opacity: .85; }
  .icon.think { opacity: 1; }
  /* 只在商标边缘加一层外发光，不改变商标本身的颜色/形状 */
  .icon.think img.logo { filter: drop-shadow(0 0 6px var(--c, #fff)); }
  .icon.sel { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c, #fff) 70%, transparent); }
  .icon.hidden { display: none; }

  /* 光效层：aura 呼吸光晕 / ring 虚线环 / orbit 轨道点 / ping 扩散圈 */
  .icon .fx { position: absolute; inset: -4px; opacity: 0; transition: opacity .45s ease; pointer-events: none; }
  .icon.think .fx { opacity: 1; }
  .icon .fx .aura {
    position: absolute; inset: 3px; border-radius: 50%;
    box-shadow: 0 0 18px -1px var(--c, #fff), 0 0 6px 0 var(--c, #fff) inset;
    animation: auraPulse 2.8s ease-in-out infinite;
  }
  .icon .fx .ring {
    position: absolute; inset: 1px; border-radius: 50%;
    border: 1px dashed var(--c, #fff); opacity: .3; animation: spin 8s linear infinite;
  }
  .icon .fx .orbit { position: absolute; inset: 0; display: none; animation: spin 4s linear infinite; }
  .icon .fx .orbit i {
    position: absolute; top: 0; left: 50%; margin-left: -2px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--c, #fff); box-shadow: 0 0 6px var(--c, #fff);
  }
  .icon .fx .orbit i.b { top: auto; bottom: 0; }
  .icon .fx .ping {
    position: absolute; inset: 3px; border-radius: 50%; display: none;
    border: 1px solid var(--c, #fff); opacity: 0; animation: ping 2.6s ease-out infinite;
  }

  /* 商标本身完全静止；动的是「商标里显示的内容」：光扫过、扫描线、内部呼吸 */
  .icon .logoWrap { position: relative; width: 30px; height: 30px; border-radius: 7px; overflow: hidden; z-index: 1; }
  .icon .logoWrap img.logo { width: 30px; height: 30px; display: block; border-radius: 7px; }

  .icon .tilefx {
    position: absolute; inset: 0; border-radius: 7px; overflow: hidden;
    pointer-events: none; opacity: 0; transition: opacity .45s ease;
  }
  .icon.think .tilefx { opacity: 1; }

  /* 内部呼吸：一层从中心晕开的柔光 */
  .icon .tilefx .glow {
    position: absolute; inset: -30%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.55), rgba(255,255,255,.08) 45%, transparent 65%);
    mix-blend-mode: soft-light;
    animation: innerGlow 3s ease-in-out infinite;
  }
  /* 扫描线：一条细亮线自上而下扫过内容 */
  .icon .tilefx .scan {
    position: absolute; left: -10%; right: -10%; height: 16%; top: -20%;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,.7), transparent);
    mix-blend-mode: overlay;
    animation: scanDown 3.2s linear infinite;
  }
  /* 高光掠过：一道柔光斜着划过 */
  .icon .tilefx .sheen {
    position: absolute; top: -20%; bottom: -20%; width: 45%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.6), transparent);
    mix-blend-mode: overlay; transform: translateX(-160%) skewX(-12deg);
    animation: sheen 3.6s ease-in-out infinite;
  }
  /* 流星：白色小光条（Kimi 黑底商标专用，默认隐藏） */
  .icon .tilefx .meteor {
    position: absolute; width: 15px; height: 2px; border-radius: 2px; opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95));
    transform: rotate(35deg); display: none;
  }
  /* 终端光标（Codex 字母牌专用，默认隐藏） */
  .icon .tilefx .cursor {
    position: absolute; left: 6px; bottom: 5px; width: 6px; height: 2px;
    background: rgba(255,255,255,.9); border-radius: 1px; display: none;
  }

  /* ———— 厂商专属「内容动效」：商标底层图零改动，效果只发生在内容层 ———— */
  /* 内容层 SVG：商标里的「内容」（鲸鱼/星芒）独立一层。底层 logo 图永远静止，
     特效只画在这一层或 tilefx 内容层上，不触碰商标像素 */
  .icon .glyph {
    position: absolute; inset: 0; margin: auto; width: 30px; height: 30px;
    display: none; pointer-events: none; z-index: 2; overflow: visible; color: #fff;
  }
  /* 鲸鱼要跃出商标框：glyph 挂在 .icon 下（logoWrap 有 overflow:hidden 会裁掉它），
     位置 = 图标内边距 5px + 商标内 7px；左右 margin auto 保持与商标水平居中对齐 */
  .icon .glyph.whale { width: 27px; height: 19px; top: 12px; bottom: auto; }
  .icon .glyph.star { color: var(--c, #fff); }
  /* DeepSeek：完整「跃出—扎回—浮现」周期（底层商标不动，glyph 在框外也可见）：
     0-8%    商标内待命、下蹲蓄力
     8-26%   用力跃起，冲出商标框上缘（translateY -30px，框高 40px）
     26-48%  空中翻身回落，扎回商标里（透明度随「入水」渐隐）
     48-62%  完全潜没（不可见）
     62-100% 从商标中重新浮现，回到待命位 */
  .icon.think.v-leap .glyph.whale { display: block; animation: whaleBreach 3.4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes whaleBreach {
    0%   { transform: translateY(0)     rotate(-6deg) scale(.98); opacity: 1; }
    8%   { transform: translateY(3px)   rotate(-4deg) scale(.94); opacity: 1; }
    26%  { transform: translateY(-30px) rotate(10deg) scale(1.08); opacity: 1; }
    38%  { transform: translateY(-14px) rotate(-6deg) scale(1.02); opacity: 1; }
    48%  { transform: translateY(4px)   rotate(-2deg) scale(.98); opacity: .22; }
    62%  { transform: translateY(6px)   rotate(0deg)  scale(.96); opacity: 0; }
    80%  { transform: translateY(-2px)  rotate(-4deg) scale(.97); opacity: .7; }
    100% { transform: translateY(0)     rotate(-6deg) scale(.98); opacity: 1; }
  }
  /* Kimi：黑色商标背景里闪过白色流星（内容层 tilefx） */
  .icon.think.v-meteor .tilefx .meteor { display: block; animation: meteorFly 1.5s linear infinite; }
  .icon.think.v-meteor .tilefx .meteor:nth-of-type(2) { animation-delay: .55s; }
  @keyframes meteorFly {
    0%   { left: -16px; top: -5px; opacity: 0; }
    15%  { opacity: 1; }
    100% { left: 32px;  top: 26px; opacity: 0; }
  }
  /* Gemini：内容层的四芒星整体闪烁（亮度 + 辉光脉动；底层商标不动） */
  .icon.think.v-glimmer .glyph.star { display: block; animation: starGlimmer 1.15s ease-in-out infinite; }
  @keyframes starGlimmer {
    0%, 100% { filter: brightness(1) drop-shadow(0 0 2px rgba(255,255,255,.15)); transform: scale(1); }
    50%      { filter: brightness(1.5) drop-shadow(0 0 9px var(--c, #fff)); transform: scale(1.12); }
  }
  /* ChatGPT：内容层上有光在线条间持续流动（无停顿的快速掠光） */
  .icon.think.v-flow .tilefx .sheen {
    width: 62%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.8), transparent);
    animation: sheenFlow 1.6s linear infinite;
  }
  @keyframes sheenFlow {
    0%   { transform: translateX(-170%) skewX(-14deg); }
    100% { transform: translateX(250%) skewX(-14deg); }
  }
  /* Claude：商标周围光晕呼吸 */
  .icon.think.v-glow .tilefx .glow { animation-duration: 2.4s; }
  .icon.think.v-glow .fx .aura { animation-duration: 2.2s; }
  /* Codex：内容层终端光标闪烁 */
  .icon.think.v-cursor .tilefx .cursor { display: block; animation: cursorBlink 1s steps(2, jump-none) infinite; }
  @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .icon.think.v-leap .logoWrap img.logo, .icon.think.v-glimmer .logoWrap img.logo { animation: none; }

  @keyframes innerGlow { 0%, 100% { opacity: .18; transform: scale(.9); } 50% { opacity: .5; transform: scale(1.05); } }
  @keyframes scanDown { 0% { top: -20%; opacity: 0; } 12% { opacity: .9; } 88% { opacity: .9; } 100% { top: 105%; opacity: 0; } }
  @keyframes sheen { 0% { transform: translateX(-160%) skewX(-12deg); } 55%, 100% { transform: translateX(260%) skewX(-12deg); } }

  @media (prefers-reduced-motion: reduce) {
    .icon.think .logoWrap img.logo, .icon .tilefx i, .icon .glyph,
    .icon .fx .aura, .icon .fx .ring, .icon .fx .orbit, .icon .fx .ping { animation: none !important; }
  }

  @keyframes auraPulse { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ping { 0% { transform: scale(.86); opacity: .6; } 100% { transform: scale(1.45); opacity: 0; } }

  /* 综合形态：多枚商标叠成的四环标记（不是厂商 logo，是「全部」入口） */
  #composite .ringset { position: relative; width: 30px; height: 30px; }
  #composite .logoWrap { display: none; }
  #composite.solo-mode .logoWrap { display: block; }
  #composite .solo { display: none; width: 30px; height: 30px; border-radius: 7px; }
  #composite .solo-mono { display: none; }
  #composite.solo-mode .ringset { display: none; }
  #composite.solo-mode .solo { display: block; filter: none; }
  #composite.solo-mode .solo-mono { display: flex; width: 30px; height: 30px; border-radius: 7px;
    align-items: center; justify-content: center; font: 600 11px/1 ui-monospace, monospace;
    color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.2); }
  #composite.solo-mode.no-icon .solo { display: none; }
  #composite.solo-mode:not(.no-icon) .solo-mono { display: none; }
  #composite .r { position: absolute; inset: 0; border-radius: 50%;
    border: 1.4px dashed rgba(255,255,255,.5); animation: spin 12s linear infinite; }
  #composite .r.b { inset: 6px; animation-duration: 8s; animation-direction: reverse; opacity: .65; }
  #composite .r.c { inset: 12px; animation-duration: 5s; opacity: .45; }
  #composite.think .r { animation-duration: 4.4s; }
  #composite.think .r.b { animation-duration: 3s; }
  #composite.think .r.c { animation-duration: 2s; }
</style>
</head>
<body>
<div id="tray">
  <div class="icon" id="composite" title="综合形态">
    <div class="ringset">
      <div class="r"></div><div class="r b"></div><div class="r c"></div>
    </div>
    <span class="logoWrap">
      <img class="solo" alt="" draggable="false">
      <span class="solo-mono"></span>
      <span class="tilefx"><i class="glow"></i><i class="scan"></i><i class="sheen"></i></span>
    </span>
    <div class="fx"><i class="aura"></i></div>
  </div>
</div>
<script>
"use strict";
const tray = document.getElementById("tray");
const composite = document.getElementById("composite");
const icons = new Map();
let expanded = false, view = "all", agents = [];

// 动效风格：商标底层图零改动——内容层（鲸鱼/星芒 SVG 或 tilefx 特效层）承担全部动态。
// DeepSeek 鲸鱼腾跃、Kimi 黑底流星、Gemini 四芒星闪烁、ChatGPT 线条流光、Claude 光晕呼吸、Codex 光标闪烁
const MOTION = {
  whale: "v-leap",
  moon: "v-meteor",
  spark4: "v-glimmer",
  knot: "v-flow",
  asterisk: "v-glow",
  term: "v-cursor",
};

/* 内容层 SVG：商标里「内容」图形的剪影层（不替换商标，叠在底层图之上做动态）。
   鲸鱼剪影对准 DeepSeek 商标中鲸鱼的位置；四芒星对准 Gemini 商标的星形。 */
const GLYPHS = {
  whale: `<svg class="glyph whale" viewBox="0 0 32 22" aria-hidden="true"><path fill="currentColor" d="M2 13c0-6 6-10 14-10 5 0 9 2 11 5l3-3c0 4-1 6-3 8l3 3-3 1c-2 2-5 3-8 3-8 0-14-3-14-7z"/><circle cx="9.5" cy="8.5" r="1.3" fill="rgba(10,12,16,.55)"/></svg>`,
  spark4: `<svg class="glyph star" viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 2 C56 36 64 44 98 50 C64 56 56 64 50 98 C44 64 36 56 2 50 C36 44 44 36 50 2 Z"/></svg>`,
};
const glyphFor = (anim) => GLYPHS[anim] || "";

/* 未使用：图标地址现在直接内联在 <img src>/srcset 里，保留备查
function SRC_NAME(source) {
  const a = agents.find((x) => x.source === source);
  return (a && a.name) || source;
}

function iconUrl(source, scale = 1) {
  return `/icon/${encodeURIComponent(source)}.png` + (scale > 1 ? "?x=2" : "");
}
*/

function build() {
  reportHeight();

  // 同一商标的厂商（ChatGPT / Codex）合并成一个图标，点击切到该商标的主来源
  const groups = new Map();
  for (const a of agents) {
    if (!a.enabled) continue;
    const key = a.icon || a.source;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  }
  for (const key of [...icons.keys()]) {
    if (!groups.has(key)) { icons.get(key)?.remove(); icons.delete(key); }
  }

  for (const [key, list] of groups) {
    const primary = list.find((a) => a.source === key) || list[0];
    const thinking = list.some((a) => a.thinking);
    let el = icons.get(key);
    if (!el) {
      el = document.createElement("div");
      el.className = "icon " + (MOTION[primary.anim] || "v-glow");
      el.dataset.src = key;
      el.innerHTML =
        `<div class="fx"><i class="aura"></i><i class="ring"></i>` +
        `<div class="orbit"><i></i><i class="b"></i></div><i class="ping"></i></div>` +
        `<span class="logoWrap">` +
        `<img class="logo" alt="" src="/icon/${key}.png" srcset="/icon/${key}@2x.png 2x" draggable="false">` +
        `<span class="tilefx"><i class="glow"></i><i class="scan"></i><i class="sheen"></i><i class="meteor"></i><i class="meteor"></i><i class="cursor"></i></span>` +
        `</span>` +
        glyphFor(primary.anim);   // 内容层挂在 .icon 下：鲸鱼跃出商标框时不被 logoWrap 裁掉
      // 没有本地商标图时才用中性字母牌（不伪造 logo）
      const img = el.querySelector("img");
      img.addEventListener("error", () => {
        img.remove();
        const mono = document.createElement("span");
        mono.className = "mono";
        mono.textContent = primary.short || key.slice(0, 2).toUpperCase();
        const wrap = el.querySelector(".logoWrap");
        if (wrap) wrap.insertBefore(mono, wrap.firstChild);
        else el.insertBefore(mono, el.firstChild);
      }, { once: true });
      el.onclick = async () => { await select(primary.source); expanded = false; build(); };
      tray.appendChild(el);
      icons.set(key, el);
    }
    el.style.setProperty("--c", primary.color);
    el.classList.toggle("think", thinking);
    el.classList.toggle("hidden", !expanded);
    el.classList.toggle("sel", list.some((a) => a.source === view));
    const names = list.map((a) => a.name || a.source).join(" / ");
    el.title = names + (thinking ? " · 思考中" : "") + (list.some((a) => a.source === view) ? " · 当前形态" : "");
  }

  const solo = view !== "all" ? agents.find((x) => x.source === view) : null;
  const soloIcon = solo ? (solo.icon || solo.source) : null;
  composite.classList.toggle("solo-mode", !!solo);
  composite.classList.toggle("sel", view === "all");
  if (solo) {
    composite.style.setProperty("--c", solo.color);
    composite.classList.toggle("think", !!solo.thinking);
    composite.title = `${solo.name || solo.source} · 当前形态（点击展开）`;
    const img = composite.querySelector(".solo");
    const mono = composite.querySelector(".solo-mono");
    mono.textContent = solo.short || soloIcon.slice(0, 2).toUpperCase();
    if (img.dataset.src !== soloIcon) {
      img.dataset.src = soloIcon;
      composite.classList.remove("no-icon");
      img.onerror = () => composite.classList.add("no-icon");
      img.src = `/icon/${soloIcon}.png`;
      img.srcset = `/icon/${soloIcon}@2x.png 2x`;
    }
  } else {
    composite.classList.remove("no-icon");
    composite.classList.toggle("think", agents.some((a) => a.enabled && a.thinking));
    composite.title = "综合形态 · 全部 agent";
  }
}

async function select(agent) {
  view = agent;
  await fetch("/view", { method: "POST", body: JSON.stringify({ agent }) });
  build();
}

let reportTimer = 0;
function reportHeight() {
  clearTimeout(reportTimer);
  reportTimer = setTimeout(() => {
    const el = document.getElementById("tray");
    const h = Math.ceil(el.getBoundingClientRect().height) + 2;
    document.documentElement.style.height = h + "px";
    document.body.style.height = h + "px";
    const msg = { height: h };
    try { window.webkit?.messageHandlers?.tray?.postMessage(msg); } catch (e) {}      // macOS 宿主
    try { window.chrome?.webview?.postMessage(msg); } catch (e) {}                    // Windows 宿主
  }, 30);
}
addEventListener("resize", reportHeight);

composite.onclick = async () => {
  if (!expanded) { expanded = true; build(); return; }   // 单击综合按钮：展开侧栏
  await select("all");                                    // 已展开时再点：回到综合形态并收回
  expanded = false;
  build();
};
composite.oncontextmenu = (e) => { e.preventDefault(); expanded = !expanded; build(); };

/** 自检：把托盘渲染成 PNG（商标图先转成 data URL，foreignObject 才能渲染） */
async function shot() {
  try {
    const el = document.getElementById("tray");
    const hidden = Array.from(el.querySelectorAll(".icon.hidden"));
    hidden.forEach((n) => n.classList.remove("hidden"));
    const rect = el.getBoundingClientRect();
    hidden.forEach((n) => n.classList.add("hidden"));
    if (!rect.width || !rect.height) return null;

    const liveIcons = Array.from(el.querySelectorAll(".icon"));
    const liveColors = liveIcons.map((n) => getComputedStyle(n).color);
    const clone = el.cloneNode(true);
    clone.querySelectorAll(".icon.hidden").forEach((n) => n.classList.remove("hidden"));   // 自检时全部展开
    clone.querySelectorAll(".icon").forEach((n, i) => { if (liveColors[i]) n.style.color = liveColors[i]; });

    // 图片转 data URL（SVG 图片渲染不允许外链）
    const liveImgs = Array.from(el.querySelectorAll("img"));
    const cloneImgs = Array.from(clone.querySelectorAll("img"));
    for (let i = 0; i < liveImgs.length; i++) {
      const src = liveImgs[i];
      try {
        const cv = document.createElement("canvas");
        cv.width = src.naturalWidth || 128;
        cv.height = src.naturalHeight || 128;
        cv.getContext("2d").drawImage(src, 0, 0);
        cloneImgs[i].src = cv.toDataURL("image/png");
      } catch { cloneImgs[i].remove(); }
    }

    const css = Array.from(document.querySelectorAll("style")).map((n) => n.textContent).join("\n");
    const html = new XMLSerializer().serializeToString(clone);
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${rect.width}" height="${rect.height}">` +
      `<foreignObject x="0" y="0" width="${rect.width}" height="${rect.height}">` +
      `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${rect.width}px;box-sizing:border-box"><style>${css}</style>${html}</div>` +
      `</foreignObject></svg>`;
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("render failed"));
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    });
    const cv = document.createElement("canvas");
    cv.width = Math.round(rect.width * 2);
    cv.height = Math.round(rect.height * 2);
    const x = cv.getContext("2d");
    x.fillStyle = "#0a0c11";
    x.fillRect(0, 0, cv.width, cv.height);
    x.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/png");
  } catch (e) { return null; }
}

let lastShotOk = null, pollN = 0;
addEventListener("error", (e) => {
  fetch("/debug", { method: "POST", body: JSON.stringify({ client: "tray", pageError: String(e.message || e.error), src: (e.filename || "") + ":" + e.lineno }) }).catch(() => {});
});

async function poll() {
  try {
    const s = await (await fetch("/agents")).json();
    agents = s.agents;
    if (view !== s.view) view = s.view;
    build();
    if (s.shot) {
      const png = await shot();
      lastShotOk = !!png;
      if (png) fetch("/snapshot", { method: "POST", body: JSON.stringify({ tray: png }) }).catch(() => {});
    }
    // 动效自检遥测：getComputedStyle 会强制样式重算，降频到每 3 轮一次（轮询仍 1.5s）
    pollN++;
    const reportAnims = s.shot || pollN % 3 === 0;
    let anims = [], sheen = [], logoAnims = [], glyphAnims = [];
    if (reportAnims) {
      anims = Array.from(document.querySelectorAll(".icon.think .tilefx i"))
        .map((el) => getComputedStyle(el).animationName)
        .filter((n) => n && n !== "none");
      sheen = Array.from(document.querySelectorAll(".icon.think .tilefx .sheen"))
        .map((el) => getComputedStyle(el).animationName);
      // 自检：底层商标图必须静止；动态只发生在内容层（glyph SVG / tilefx 特效层）
      logoAnims = Array.from(document.querySelectorAll(".icon.think img.logo, .icon.think img.solo"))
        .map((el) => getComputedStyle(el).animationName)
        .filter((n) => n && n !== "none");
      glyphAnims = Array.from(document.querySelectorAll(".icon.think .glyph"))
        .map((el) => getComputedStyle(el).animationName)
        .filter((n) => n && n !== "none");
    }
    const motion = Array.from(icons.values()).map((el) => (el.className.match(/v-[a-z]+/) || [""])[0]);
    fetch("/debug", {
      method: "POST",
      body: JSON.stringify({ client: "tray", agents: agents.length, expanded, shot: !!s.shot, lastShotOk, anims, sheen, logoAnims, glyphAnims, motion }),
    }).catch(() => {});
  } catch (e) { lastShotOk = "poll-error"; }
}
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
