<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinking Desktop · HALOFLUX</title>
<style>
:root{
  --bg:#08090b; --text:#cfd2d8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;overflow:hidden}
.app{display:grid;grid-template-rows:minmax(0,1fr);height:100vh}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),
             radial-gradient(ellipse at 40% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ---- wallpaper build ---- */
html,body,.stage{cursor:none}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stageWrap">
    <canvas id="stage"></canvas>
  </div>
</div>

<script src="halo.js"></script>
<script src="wp.js"></script>
<script src="td-bridge.js"></script>
</body>
</html>
